spring.application.name=SpringEcommerce

#spring.datasource.url=jdbc:postgresql://localhost:5432/Ecommerce
#spring.datasource.username=postgres
#spring.datasource.password=$oumadeep28

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.jpa.show-sql=true
spring.ai.openai.embedding.model=text-embedding-3-small
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always

spring.ai.openai.chat.model=gpt-5.6-terra
spring.ai.openai.image.model=gpt-image-2.5-flare

jwt.secret=${SECRET_KEY}
google.client.id=${GOOGLE_CLIENT_ID}
smartcart.frontend.url=${FRONTEND_URL}
smartcart.admin.email=${ADMIN_EMAIL}

smartcart.tokens.initial=30
smartcart.tokens.cost.chat=2
smartcart.tokens.cost.description=3
smartcart.tokens.cost.image=10